# Site configuration. site.url is left unset on purpose: the Roq GitHub Action
# derives the GitHub Pages URL (including the /repo-name/ path) from the
# repository. website-builder sets it when a custom domain is connected.
quarkus.qute.alt-expr-syntax=true

# Blog posts: markdown files under content/posts/. The old Blogger site served
# posts at /YYYY/MM/slug.html, so match that pattern natively and keep every
# old link working without a redirect.
site.collections.posts.layout=post
site.collections.posts.link=/:year/:month/:slug.html

quarkus.roq.generator.timeout=120

# The photo viewer: web/lightbox/ is its own bundle, loaded on every page by the default layout.
quarkus.web-bundler.bundle.lightbox=true
